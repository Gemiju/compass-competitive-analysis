# Compass 竞品分析 · 项目配置模板
# 复制本文件为 project.yaml 并按需修改。SKILL 启动时优先读取 project.yaml，缺失则用本模板默认值。

# === 必填 ===
product:
  name: "示例产品"              # 主品名称
  category: "b2b_commercial_tablet"  # 品类，参考 taxonomy.md
  self_product: true           # 是否是用户方产品

competitors:
  - name: "竞品A"
    products: ["产品X"]         # 已知竞品仅作为搜索起点
    priority: "P0"             # P0=核心对标 / P1=次要 / P2=背景
  # - name: "竞品B"
  #   products: ["产品Y"]
  #   priority: "P1"

market:
  country: "US"                # ISO 国家代码
  language: "en"               # 评论/官网语言
  region: "North America"      # 区域

time_window:
  start: "2026-04-01"          # 数据时间窗起（默认最近 90 天）
  end: "2026-06-30"
  default_days: 90             # 若未指定 start/end，取最近 N 天

business_decision:             # 本次分析要支持的业务决策
  type: "pricing_switch"       # pricing_switch / gtm_launch / eol_transition / channel_expansion
  description: "价格切换决策，需识别折扣栈与价格定位"

# === 数据源 ===
data_sources:
  local_evidence_db:           # 本地证据库（confidence=high）
    enabled: true
    path: "assets/evidence_db/"
    files:
      - path: "path/to/data.xlsx"
        type: "excel"
        competitor: "竞品A"
        aspect_hint: "feature_benchmark"
      - path: "path/to/price_list.pdf"
        type: "pdf"
        competitor: "竞品A"
        aspect_hint: "pricing"
  web_search:                  # 联网搜索兜底（confidence=medium）
    enabled: true
    sources:
      - "reddit:industry,B2B"
      - "youtube:transcript"
      - "amazon:reviews"
      - "official_site"
    fallback_when_local_miss: true

# === 可选 ===
icp:
  industry: ["retail", "hospitality"]
  persona: ["procurement_officer", "it_admin", "channel_partner"]
  scenario: ["pos_checkout", "self_service_kiosk"]
  icp_value_metric: "per_inch_display"

analysis_depth: "deep"
output_dir: "examples/demo"

# === 自定义 taxonomy 扩展 ===
custom_taxonomy:
  # 若品类需要新 aspect，在此补充

# === 验证门槛 ===
verification:
  min_independent_authors: 3
  min_evidence_per_competitor: 5
  flag_uncited_claims: true

# === 假设 ===
assumptions:
  - "默认英语评论"
  - "时间窗默认最近 90 天"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass 竞品分析</title>
<!-- Markdown 渲染库 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --c-bg:#0f1419; --c-card:#1a2029; --c-border:#2a3340;
    --c-text:#e6eaf0; --c-muted:#8b95a5; --c-accent:#4f9cf9;
    --c-lead:#3dd68c; --c-warn:#ffb454; --c-err:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--c-bg); color:var(--c-text); line-height:1.6; min-height:100vh;
  }
  .container{max-width:960px;margin:0 auto;padding:32px 24px}

  /* Header */
  header{text-align:center;margin-bottom:32px}
  header h1{font-size:28px;font-weight:700;margin-bottom:8px}
  header h1 span{color:var(--c-accent)}
  header p{color:var(--c-muted);font-size:14px}
  header .badges{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  header .badge{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(79,156,249,.12);color:var(--c-accent);border:1px solid rgba(79,156,249,.2)}

  /* Form */
  .form-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:16px;padding:28px;margin-bottom:24px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .form-row.full{grid-template-columns:1fr}
  .form-field label{display:block;font-size:13px;color:var(--c-muted);margin-bottom:6px;font-weight:600}
  .form-field label .req{color:var(--c-err)}
  .form-field input,.form-field select,.form-field textarea{
    width:100%;background:rgba(0,0,0,.25);border:1px solid var(--c-border);border-radius:8px;
    padding:12px 14px;color:var(--c-text);font-size:14px;font-family:inherit;transition:border-color .2s;
  }
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{
    outline:none;border-color:var(--c-accent);
  }
  .form-field textarea{resize:vertical;min-height:60px}
  .form-field .hint{font-size:11px;color:var(--c-muted);margin-top:4px}

  /* Button */
  .btn{
    width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;
    cursor:pointer;transition:all .2s;font-family:inherit;
  }
  .btn-primary{background:linear-gradient(135deg,#4f9cf9,#3dd68c);color:#fff}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(79,156,249,.3)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-secondary{background:var(--c-card);color:var(--c-text);border:1px solid var(--c-border);font-size:13px;padding:10px 16px;width:auto}
  .btn-secondary:hover{border-color:var(--c-accent);color:var(--c-accent)}

  /* Progress */
  .progress-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:16px;padding:28px;margin-bottom:24px;display:none}
  .progress-card.show{display:block}
  .progress-steps{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .step{flex:1;min-width:120px;text-align:center;padding:12px 8px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--c-border);transition:all .3s}
  .step.active{border-color:var(--c-accent);background:rgba(79,156,249,.08)}
  .step.done{border-color:var(--c-lead);background:rgba(61,214,140,.08)}
  .step .num{font-size:20px;font-weight:700;color:var(--c-muted)}
  .step.active .num{color:var(--c-accent)}
  .step.done .num{color:var(--c-lead)}
  .step .label{font-size:11px;color:var(--c-muted);margin-top:4px}
  .step.active .label,.step.done .label{color:var(--c-text)}
  .spinner{width:40px;height:40px;border:3px solid var(--c-border);border-top-color:var(--c-accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-text{text-align:center;color:var(--c-muted);font-size:13px}

  /* Error */
  .error-card{background:rgba(255,107,107,.08);border:1px solid var(--c-err);border-radius:12px;padding:20px;margin-bottom:24px;display:none}
  .error-card.show{display:block}
  .error-card h3{color:var(--c-err);font-size:15px;margin-bottom:8px}

  /* Report */
  .report-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:16px;overflow:hidden;display:none}
  .report-card.show{display:block}
  .report-toolbar{display:flex;gap:8px;padding:16px 20px;border-bottom:1px solid var(--c-border);align-items:center;justify-content:space-between}
  .report-toolbar .title{font-size:14px;font-weight:600;color:var(--c-muted)}
  .report-toolbar .actions{display:flex;gap:8px}
  .report-body{padding:28px 32px;max-height:none}
  .report-body h1{font-size:22px;margin:20px 0 12px;color:var(--c-text)}
  .report-body h1:first-child{margin-top:0}
  .report-body h2{font-size:17px;margin:24px 0 12px;color:var(--c-accent);border-bottom:1px solid var(--c-border);padding-bottom:6px}
  .report-body h3{font-size:14px;margin:18px 0 8px;color:var(--c-muted)}
  .report-body p{margin:8px 0;font-size:14px}
  .report-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
  .report-body th,.report-body td{padding:8px 10px;border:1px solid var(--c-border);text-align:left}
  .report-body th{background:rgba(79,156,249,.08);color:var(--c-muted);font-weight:600;font-size:12px}
  .report-body code{background:rgba(79,156,249,.1);color:var(--c-accent);padding:1px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .report-body blockquote{border-left:3px solid var(--c-accent);padding:8px 14px;margin:12px 0;background:rgba(79,156,249,.05);border-radius:0 6px 6px 0;font-size:13px}
  .report-body ul,.report-body ol{padding-left:24px;margin:8px 0}
  .report-body li{font-size:14px;margin:4px 0}
  .report-body hr{border:none;border-top:1px solid var(--c-border);margin:20px 0}
  .report-body strong{color:var(--c-text)}

  /* Responsive */
  @media(max-width:640px){
    .form-row{grid-template-columns:1fr}
    .progress-steps{flex-direction:column}
    .step{min-width:auto}
    .report-body{padding:20px 16px}
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Compass <span>竞品分析</span></h1>
    <p>输入竞品名称，AI 自动生成功能对标 / 价格策略 / 渠道打法三维结构化报告</p>
    <div class="badges">
      <span class="badge">RAG 架构</span>
      <span class="badge">6 步分析框架</span>
      <span class="badge">Powered by DeepSeek</span>
    </div>
  </header>

  <!-- 输入表单 -->
  <div class="form-card">
    <div class="form-row full">
      <div class="form-field">
        <label>DeepSeek API Key <span class="req">*</span></label>
        <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" value="">
        <div class="hint">必填。前往 <a href="https://platform.deepseek.com/" target="_blank" style="color:var(--c-accent)">platform.deepseek.com</a> 获取，仅在本地点击时发送给后端</div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>竞品名称 <span class="req">*</span></label>
        <input type="text" id="competitor" placeholder="如：Notion / 天之河 TZH-P13 / Salesforce" value="">
        <div class="hint">必填。你想分析的竞品产品名</div>
      </div>
      <div class="form-field">
        <label>主品（自家产品）</label>
        <input type="text" id="self_product" placeholder="如：商米 CPAD T2（选填）">
        <div class="hint">选填。不填则分析竞品本身的市场定位</div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>目标市场</label>
        <input type="text" id="market" placeholder="如：印度 / 北美 SaaS / 全球" value="">
        <div class="hint">选填，默认全球</div>
      </div>
      <div class="form-field">
        <label>分析深度</label>
        <select id="depth">
          <option value="深度">深度分析（6 步完整报告）</option>
          <option value="基础">基础分析（执行摘要 + 关键发现）</option>
        </select>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-field">
        <label>业务决策（选填）</label>
        <textarea id="decision" placeholder="如：H2 价格切换 / 是否进入该赛道 / 渠道拓展优先级"></textarea>
        <div class="hint">选填。告诉 AI 这份报告要支撑什么决策，分析会更聚焦</div>
      </div>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="analyze()">
      生成竞品分析报告
    </button>
  </div>

  <!-- 进度 -->
  <div class="progress-card" id="progressCard">
    <div class="progress-steps">
      <div class="step" id="step1"><div class="num">1</div><div class="label">明确目标</div></div>
      <div class="step" id="step2"><div class="num">2</div><div class="label">选择竞品</div></div>
      <div class="step" id="step3"><div class="num">3</div><div class="label">确定维度</div></div>
      <div class="step" id="step4"><div class="num">4</div><div class="label">收集信息</div></div>
      <div class="step" id="step5"><div class="num">5</div><div class="label">整理分析</div></div>
      <div class="step" id="step6"><div class="num">6</div><div class="label">总结报告</div></div>
    </div>
    <div class="spinner"></div>
    <div class="progress-text" id="progressText">正在调用 DeepSeek 分析中，预计 30-60 秒...</div>
  </div>

  <!-- 错误 -->
  <div class="error-card" id="errorCard">
    <h3>分析失败</h3>
    <p id="errorMsg" style="font-size:13px;color:var(--c-muted)"></p>
  </div>

  <!-- 报告 -->
  <div class="report-card" id="reportCard">
    <div class="report-toolbar">
      <span class="title">📊 竞品分析报告</span>
      <div class="actions">
        <button class="btn btn-secondary" onclick="downloadMarkdown()">下载 .md</button>
        <button class="btn btn-secondary" onclick="downloadHTML()">下载 .html</button>
      </div>
    </div>
    <div class="report-body" id="reportBody"></div>
  </div>

</div>

<script>
  let currentReport = '';

  // 模拟阶段进度动画
  function startProgress() {
    const steps = ['step1', 'step2', 'step3', 'step4', 'step5', 'step6'];
    const labels = [
      'Step 1：明确目标（决策问题 / 分析方向）...',
      'Step 2：选择竞品（寻找 → 划分 → 挑选）...',
      'Step 3：确定分析维度（产品/用户/市场视角）...',
      'Step 4：收集竞品信息（规格对比表生成中）...',
      'Step 5：信息整理与分析（Gap 矩阵 / 价格策略）...',
      'Step 6：总结报告（优劣势 / Message House）...'
    ];
    let i = 0;
    document.getElementById('step1').classList.add('active');
    document.getElementById('progressText').textContent = labels[0];

    return setInterval(() => {
      if (i < steps.length - 1) {
        document.getElementById(steps[i]).classList.remove('active');
        document.getElementById(steps[i]).classList.add('done');
        i++;
        document.getElementById(steps[i]).classList.add('active');
        document.getElementById('progressText').textContent = labels[i];
      }
    }, 7000); // 每 7 秒推进一步（总约 42 秒）
  }

  function stopProgress(intervalId, success) {
    clearInterval(intervalId);
    const steps = ['step1', 'step2', 'step3', 'step4', 'step5', 'step6'];
    if (success) {
      steps.forEach(s => {
        document.getElementById(s).classList.remove('active');
        document.getElementById(s).classList.add('done');
      });
      document.getElementById('progressText').textContent = '报告生成完成！';
    }
  }

  async function analyze() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const competitor = document.getElementById('competitor').value.trim();
    const self_product = document.getElementById('self_product').value.trim();
    const market = document.getElementById('market').value.trim();
    const decision = document.getElementById('decision').value.trim();
    const depth = document.getElementById('depth').value;

    if (!apiKey) {
      alert('请输入 DeepSeek API Key');
      return;
    }
    if (!competitor) {
      alert('请输入竞品名称');
      return;
    }

    // UI 状态切换
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '分析中...';
    document.getElementById('errorCard').classList.remove('show');
    document.getElementById('reportCard').classList.remove('show');
    document.getElementById('progressCard').classList.add('show');

    // 重置步骤
    ['step1','step2','step3','step4','step5','step6'].forEach(s => {
      document.getElementById(s).classList.remove('active','done');
    });

    const intervalId = startProgress();

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey, competitor, self_product, market, decision, depth })
      });

      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.error || data.detail || '请求失败');
      }

      currentReport = data.report;
      stopProgress(intervalId, true);

      // 渲染 Markdown
      setTimeout(() => {
        document.getElementById('progressCard').classList.remove('show');
        document.getElementById('reportBody').innerHTML = marked.parse(data.report);
        document.getElementById('reportCard').classList.add('show');
        document.getElementById('reportCard').scrollIntoView({ behavior: 'smooth' });
      }, 600);

    } catch (err) {
      stopProgress(intervalId, false);
      document.getElementById('progressCard').classList.remove('show');
      document.getElementById('errorMsg').textContent = err.message;
      document.getElementById('errorCard').classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = '生成竞品分析报告';
    }
  }

  function downloadMarkdown() {
    if (!currentReport) return;
    const blob = new Blob([currentReport], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'compass_report.md';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function downloadHTML() {
    if (!currentReport) return;
    const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Compass 竞品分析报告</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>
<style>
  body{font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;background:#0f1419;color:#e6eaf0;line-height:1.6;padding:32px;max-width:960px;margin:0 auto}
  h1{font-size:22px;color:#e6eaf0;margin:20px 0 12px}
  h1:first-child{margin-top:0}
  h2{font-size:17px;color:#4f9cf9;border-bottom:1px solid #2a3340;padding-bottom:6px;margin:24px 0 12px}
  h3{font-size:14px;color:#8b95a5;margin:18px 0 8px}
  p{font-size:14px;margin:8px 0}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
  th,td{padding:8px 10px;border:1px solid #2a3340;text-align:left}
  th{background:rgba(79,156,249,.08);color:#8b95a5}
  code{background:rgba(79,156,249,.1);color:#4f9cf9;padding:1px 6px;border-radius:4px;font-size:12px}
  blockquote{border-left:3px solid #4f9cf9;padding:8px 14px;margin:12px 0;background:rgba(79,156,249,.05);border-radius:0 6px 6px 0;font-size:13px}
  ul,ol{padding-left:24px;margin:8px 0}
  li{font-size:14px;margin:4px 0}
  hr{border:none;border-top:1px solid #2a3340;margin:20px 0}
  strong{color:#e6eaf0}
</style>
</head>
<body>
<div id="content"></div>
<script>
  document.getElementById('content').innerHTML = marked.parse(${JSON.stringify(JSON.stringify(currentReport))});
<\/script>
</body>
</html>`;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'compass_report.html';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // 回车提交
  document.getElementById('competitor').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') analyze();
  });
</script>
</body>
</html>
